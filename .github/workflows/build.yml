name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - redesign/v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npx --yes npm@11.11.1 ci

      - name: Build site
        run: npm run build
